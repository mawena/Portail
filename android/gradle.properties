# Démons bornés pour le poste de 14 Go : à -Xmx8G, Gradle montait à près de 8 Go et Gagarine le figeait (2026-11-12).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true

# Les ABI sont fixées dans app/build.gradle.kts (arm64-v8a, x86_64) ; sans cela le plugin Flutter ajoute armeabi-v7a.
disable-abi-filtering=true
